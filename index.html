<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Khaiii 💗</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{background:#f9e4e4;overflow:hidden;font-family:Georgia,serif}
#app{width:100%;height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:25px}

#introScreen{width:100%;cursor:pointer;user-select:none}
.introTitle{margin:0;color:#d72832;font-size:clamp(30px,6vw,58px);font-weight:bold}
.introSubtitle{margin-top:25px;color:#806d69;font-family:monospace;font-size:clamp(17px,3vw,23px)}
.tapHint{margin-top:50px;color:#d72832;font-size:30px;animation:pulse 1.4s infinite}

@keyframes pulse{
0%,100%{opacity:.4;transform:scale(1)}
50%{opacity:1;transform:scale(1.15)}
}

#firstScreen{display:none;width:100%;max-width:900px}
.firstPhoto{width:min(400px,75vw);max-height:48vh;object-fit:contain;margin-bottom:35px;border-radius:12px}

#question{margin:0 0 32px;color:#d72832;font-family:monospace;font-size:clamp(23px,4vw,36px);font-weight:500}

.buttons{display:flex;justify-content:center;align-items:center;gap:15px;min-height:80px}

button{border:0;border-radius:50px;padding:16px 38px;font-size:21px;font-weight:bold;cursor:pointer;touch-action:manipulation}

#yes{background:#f2b1c4;color:#96344f}
#no{background:#fffafa;color:#796967;z-index:30}
#message{min-height:35px;margin-top:20px;color:#d72832;font-family:monospace;font-size:19px;font-weight:bold}

#successScreen{display:none;width:100%;max-width:900px;position:relative;z-index:5}
#successText{margin-bottom:25px;color:#d72832;font-family:monospace;font-size:clamp(28px,6vw,55px);font-weight:bold}
#successPhoto{width:min(500px,82vw);max-height:60vh;object-fit:contain;border-radius:15px}

.fade{animation:fadeIn .7s ease}
@keyframes fadeIn{
from{opacity:0;transform:scale(.94)}
to{opacity:1;transform:scale(1)}
}

.firework{
position:fixed;width:7px;height:7px;border-radius:50%;
pointer-events:none;z-index:100;
animation:explode 1.5s cubic-bezier(.1,.7,.2,1) forwards
}

@keyframes explode{
0%{transform:translate(0,0) scale(1.5);opacity:1}
65%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}
}
</style>
</head>

<body>

<div id="app">

<section id="introScreen">
<h1 class="introTitle">Hi Khaiii, I have something to tell you..</h1>
<p class="introSubtitle">Tap the screen!</p>
<div class="tapHint">♡</div>
</section>

<section id="firstScreen">

<img src="first.jpg" class="firstPhoto" alt="Flower">

<h1 id="question">Do you want to go out with me?</h1>

<div class="buttons">
<button id="yes">YES 💗</button>
<button id="no">NO</button>
</div>

<div id="message"></div>

</section>

<section id="successScreen">

<div id="successText">waaaaaaaa ty love uuu 💗</div>

<img src="final.jpg" id="successPhoto" alt="Celebration">

</section>

</div>

<audio id="loveSong" preload="auto">
<source src="love-song.mp3.mp3" type="audio/mpeg">
</audio>

<audio id="fanfare" preload="auto">
<source src="fanfare.mp3" type="audio/mpeg">
</audio>

<script>

const introScreen=document.getElementById("introScreen");
const firstScreen=document.getElementById("firstScreen");
const successScreen=document.getElementById("successScreen");

const yesButton=document.getElementById("yes");
const noButton=document.getElementById("no");

const question=document.getElementById("question");
const message=document.getElementById("message");

const loveSong=document.getElementById("loveSong");
const fanfare=document.getElementById("fanfare");

let started=false;
let noCount=0;
let escapeCount=0;
let noLocked=false;


/* 첫 화면 */

function startExperience(){

if(started)return;

started=true;

loveSong.volume=.65;

loveSong.currentTime=0;

loveSong.play().catch(function(error){
console.log("Love song error:",error);
});

introScreen.style.display="none";

firstScreen.style.display="block";

firstScreen.classList.add("fade");

}

introScreen.addEventListener("click",startExperience);



/* PC NO 도망 */

function moveNoButton(){

if(noLocked)return;

if(noButton.style.display==="none")return;

escapeCount++;

if(escapeCount>=7){

noButton.style.opacity="0";

setTimeout(function(){

noButton.style.display="none";

},200);

return;

}

const padding=35;

const width=noButton.offsetWidth;

const height=noButton.offsetHeight;

const maxX=Math.max(
padding,
window.innerWidth-width-padding
);

const maxY=Math.max(
padding,
window.innerHeight-height-padding
);

const x=padding+
Math.random()*Math.max(1,maxX-padding);

const y=padding+
Math.random()*Math.max(1,maxY-padding);

noButton.style.position="fixed";

noButton.style.left=x+"px";

noButton.style.top=y+"px";

noButton.style.opacity="1";

}


noButton.addEventListener("mouseenter",function(){

if(noLocked)return;

const desktop=window.matchMedia(
"(hover:hover) and (pointer:fine)"
).matches;

if(desktop)moveNoButton();

});



/* NO 클릭 */

noButton.addEventListener("click",function(){

if(noLocked)return;

noCount++;


if(noCount===1){

question.textContent="Are u sure?";

message.textContent="(Think again!)";

setTimeout(function(){

question.textContent=
"Do you want to go out with me?";

message.textContent="";

},1300);

}


else if(noCount===2){

question.textContent="真的吗？";

message.textContent="(Think again!)";

setTimeout(function(){

question.textContent=
"Do you want to go out with me?";

message.textContent="";

},1300);

}


else if(noCount===3){

noLocked=true;

question.textContent="NO REJECT";

question.style.color="#d00000";

message.textContent="";

noButton.style.pointerEvents="none";

setTimeout(function(){

question.textContent=
"Do you want to go out with me?";

question.style.color="#d72832";

noButton.style.display="none";

},1600);

}

});



/* YES */

yesButton.addEventListener("click",function(){

loveSong.pause();

loveSong.currentTime=0;

firstScreen.style.display="none";

successScreen.style.display="block";

successScreen.classList.add("fade");

fanfare.pause();

fanfare.currentTime=0;

fanfare.volume=.9;

fanfare.play().catch(function(error){
console.log("Fanfare error:",error);
});

startFireworks();

});



/* 폭죽 */

function createFirework(x,y){

const count=45;

const colors=[
"#ff5c8a",
"#ffcc66",
"#ff6b6b",
"#8fd3ff",
"#c58cff",
"#ffffff"
];

for(let i=0;i<count;i++){

const particle=document.createElement("div");

particle.className="firework";

particle.style.left=x+"px";

particle.style.top=y+"px";

const angle=Math.PI*2*i/count;

const distance=80+Math.random()*170;

particle.style.setProperty(
"--x",
Math.cos(angle)*distance+"px"
);

particle.style.setProperty(
"--y",
Math.sin(angle)*distance+"px"
);

particle.style.background=
colors[Math.floor(Math.random()*colors.length)];

document.body.appendChild(particle);

setTimeout(function(){
particle.remove();
},1500);

}

}


function startFireworks(){

const positions=[

[innerWidth*.18,innerHeight*.25],
[innerWidth*.82,innerHeight*.25],
[innerWidth*.50,innerHeight*.18],
[innerWidth*.28,innerHeight*.48],
[innerWidth*.72,innerHeight*.48],
[innerWidth*.50,innerHeight*.38]

];

positions.forEach(function(position,index){

setTimeout(function(){

createFirework(
position[0],
position[1]
);

},index*280);

});


setTimeout(function(){

positions.forEach(function(position,index){

setTimeout(function(){

createFirework(
position[0],
position[1]
);

},index*180);

});

},2300);


setTimeout(function(){

createFirework(
innerWidth*.5,
innerHeight*.25
);

},4200);

}

</script>

</body>
</html>
