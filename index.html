<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Khaiii 💗</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #f9e4e4;
    overflow: hidden;
    font-family: Georgia, serif;
}

#app {
    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 25px;
}


/* =========================
   첫 화면
========================= */

#introScreen {
    width: 100%;
    cursor: pointer;
    user-select: none;
}

.introTitle {
    margin: 0;

    color: #d72832;

    font-size: clamp(30px, 6vw, 58px);
    font-weight: bold;
}

.introSubtitle {
    margin-top: 25px;

    color: #806d69;

    font-family: monospace;
    font-size: clamp(17px, 3vw, 23px);
}

.tapHint {
    margin-top: 50px;

    color: #d72832;

    font-size: 30px;

    animation: pulse 1.4s infinite;
}

@keyframes pulse {

    0%, 100% {
        opacity: 0.4;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =========================
   고백 화면
========================= */

#firstScreen {
    display: none;

    width: 100%;
    max-width: 900px;
}

.firstPhoto {
    width: min(400px, 75vw);
    max-height: 48vh;

    object-fit: contain;

    margin-bottom: 35px;

    border-radius: 12px;
}

#question {
    margin: 0 0 32px;

    color: #d72832;

    font-family: monospace;

    font-size: clamp(23px, 4vw, 36px);

    font-weight: 500;
}

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 15px;

    min-height: 80px;
}

button {
    border: none;

    border-radius: 50px;

    padding: 16px 38px;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}

#yes {
    background: #f2b1c4;
    color: #96344f;
}

#no {
    background: #fffafa;
    color: #796967;
}

#message {
    min-height: 35px;

    margin-top: 20px;

    color: #d72832;

    font-family: monospace;

    font-size: 19px;

    font-weight: bold;
}


/* =========================
   성공 화면
========================= */

#successScreen {
    display: none;

    width: 100%;
    max-width: 900px;

    position: relative;
    z-index: 5;
}

#successText {
    margin-bottom: 25px;

    color: #d72832;

    font-family: monospace;

    font-size: clamp(28px, 6vw, 55px);

    font-weight: bold;
}

#successPhoto {
    width: min(500px, 82vw);

    max-height: 60vh;

    object-fit: contain;

    border-radius: 15px;
}


/* =========================
   화면 전환
========================= */

.fade {
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: scale(0.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================
   폭죽
========================= */

.firework {
    position: fixed;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 20;

    animation:
        fireworkMove 1.4s
        cubic-bezier(0.1, 0.7, 0.2, 1)
        forwards;
}

@keyframes fireworkMove {

    0% {
        transform:
            translate(0, 0)
            scale(1.4);

        opacity: 1;
    }

    70% {
        opacity: 1;
    }

    100% {
        transform:
            translate(var(--x), var(--y))
            scale(0.1);

        opacity: 0;
    }
}

</style>
</head>


<body>

<div id="app">


    <!-- =====================
         INTRO
    ====================== -->

    <section id="introScreen">

        <h1 class="introTitle">
            Hi Khaiii, I have something to tell you..
        </h1>

        <p class="introSubtitle">
            Tap the screen!
        </p>

        <div class="tapHint">
            ♡
        </div>

    </section>



    <!-- =====================
         CONFESSION
    ====================== -->

    <section id="firstScreen">

        <img
            src="first.jpg"
            class="firstPhoto"
            alt="Flower"
        >

        <h1 id="question">
            Do you want to go out with me?
        </h1>


        <div class="buttons">

            <button id="yes">
                YES 💗
            </button>

            <button id="no">
                NO
            </button>

        </div>


        <div id="message"></div>

    </section>



    <!-- =====================
         SUCCESS
    ====================== -->

    <section id="successScreen">

        <div id="successText">
            waaaaaaaa ty love uuu 💗
        </div>

        <img
            src="final.jpg"
            id="successPhoto"
            alt="Celebration"
        >

    </section>

</div>


<!-- =====================
     AUDIO
====================== -->

<audio
    id="loveSong"
    preload="auto"
    playsinline
>
    <source
        src="love-song.mp3"
        type="audio/mpeg"
    >
</audio>


<audio
    id="fanfare"
    preload="auto"
    playsinline
>
    <source
        src="fanfare.mp3"
        type="audio/mpeg"
    >
</audio>



<script>

const introScreen =
    document.getElementById("introScreen");

const firstScreen =
    document.getElementById("firstScreen");

const successScreen =
    document.getElementById("successScreen");

const yesButton =
    document.getElementById("yes");

const noButton =
    document.getElementById("no");

const question =
    document.getElementById("question");

const message =
    document.getElementById("message");

const loveSong =
    document.getElementById("loveSong");

const fanfare =
    document.getElementById("fanfare");


let started = false;

let noCount = 0;

let escapeCount = 0;


/* ==========================================
   첫 화면 클릭
========================================== */

let started = false;
let musicStarted = false;

async function startExperience() {

    // 이미 화면을 넘어갔다면 다시 실행하지 않음
    if (started) return;

    // 음악 재생 시도
    try {
        loveSong.volume = 0.65;
        loveSong.currentTime = 0;

        await loveSong.play();

        musicStarted = true;

    } catch (error) {
        console.log("Music play blocked:", error);
        musicStarted = false;
    }

    // 화면 전환
    started = true;

    introScreen.style.display = "none";

    firstScreen.style.display = "block";

    firstScreen.classList.add("fade");
}


/*
첫 화면을 누르면 음악 + 다음 화면
*/
introScreen.addEventListener(
    "pointerdown",
    startExperience
);


/*
혹시 첫 번째 재생이 실패했을 경우
사용자가 화면을 다시 누르면 음악 재생 재시도
*/
document.addEventListener("pointerdown", () => {

    if (!musicStarted && started) {

        loveSong.volume = 0.65;

        loveSong.play()
            .then(() => {
                musicStarted = true;
            })
            .catch(() => {});

    }

});(
    "pointerdown",
    startExperience
);



/* ==========================================
   PC - NO 도망
========================================== */

function moveNoButton() {

    escapeCount++;


    const padding = 30;


    const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        padding;


    const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        padding;


    const x =
        Math.max(
            padding,
            Math.random() * maxX
        );


    const y =
        Math.max(
            padding,
            Math.random() * maxY
        );


    noButton.style.position =
        "fixed";


    noButton.style.left =
        x + "px";


    noButton.style.top =
        y + "px";


    /*
       PC에서는 여러 번 도망가면
       NO REJECT 후 NO 제거
    */

    if (escapeCount >= 7) {

        question.textContent =
            "NO REJECT";

        question.style.color =
            "#d00000";


        setTimeout(() => {

            question.textContent =
                "Do you want to go out with me?";

            question.style.color =
                "#d72832";

            /*
               여기서 처음으로 NO가 사라짐
            */

            noButton.style.display =
                "none";

        }, 1200);

    }

}


/*
   PC에서 마우스가 NO에 닿기만 해도 도망감
*/

noButton.addEventListener(
    "mouseenter",
    () => {

        const desktop =
            window.matchMedia(
                "(hover: hover) and (pointer: fine)"
            ).matches;


        if (desktop) {

            moveNoButton();

        }

    }
);



/* ==========================================
   모바일 - NO
========================================== */

noButton.addEventListener(
    "click",
    () => {

        const mobile =
            window.matchMedia(
                "(pointer: coarse)"
            ).matches;


        /*
           PC에서는 클릭해도 도망가기
        */

        if (!mobile) {

            moveNoButton();

            return;

        }


        /*
           중요:
           NO를 실제로 눌렀을 때만 count 증가
        */

        noCount++;


        /* =========================
           첫 번째 NO
        ========================= */

        if (noCount === 1) {

            question.textContent =
                "Are u sure?";

            message.textContent =
                "(Think again!)";


            setTimeout(() => {

                question.textContent =
                    "Do you want to go out with me?";

                message.textContent =
                    "";

            }, 1300);

        }


        /* =========================
           두 번째 NO
        ========================= */

        else if (noCount === 2) {

            question.textContent =
                "真的吗？";

            message.textContent =
                "(Think again!)";


            setTimeout(() => {

                question.textContent =
                    "Do you want to go out with me?";

                message.textContent =
                    "";

            }, 1300);

        }


        /* =========================
           세 번째 NO
        ========================= */

        else if (noCount === 3) {

            question.textContent =
                "NO REJECT";

            message.textContent =
                "";

            question.style.color =
                "#d00000";


            /*
               3번째 NO를 누른 뒤에만
               NO 버튼 제거
            */

            setTimeout(() => {

                question.textContent =
                    "Do you want to go out with me?";

                question.style.color =
                    "#d72832";


                noButton.style.display =
                    "none";

            }, 1400);

        }

    }
);



/* ==========================================
   YES
========================================== */

yesButton.addEventListener(
    "click",
    () => {


        /*
           첫 번째 음악 완전히 정지
        */

        loveSong.pause();

        loveSong.currentTime = 0;


        /*
           고백 화면 제거
        */

        firstScreen.style.display =
            "none";


        /*
           성공 화면
        */

        successScreen.style.display =
            "block";

        successScreen.classList.add(
            "fade"
        );


        /*
           축하 음악
        */

        fanfare.pause();

        fanfare.currentTime =
            0;

        fanfare.volume =
            0.9;


        const fanfarePromise =
            fanfare.play();


        if (
            fanfarePromise !== undefined
        ) {

            fanfarePromise.catch(() => {});

        }


        /*
           폭죽 시작
        */

        startFireworks();

    }
);



/* ==========================================
   폭죽 하나
========================================== */

function createFirework(
    centerX,
    centerY
) {

    const particles =
        45;


    for (
        let i = 0;
        i < particles;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "firework";


        particle.style.left =
            centerX + "px";


        particle.style.top =
            centerY + "px";


        const angle =
            (
                Math.PI * 2 * i
            ) /
            particles;


        const distance =
            80 +
            Math.random() * 170;


        const x =
            Math.cos(angle) *
            distance;


        const y =
            Math.sin(angle) *
            distance;


        particle.style.setProperty(
            "--x",
            x + "px"
        );


        particle.style.setProperty(
            "--y",
            y + "px"
        );


        /*
           폭죽마다 다른 색
        */

        const colors = [
            "#ff5c8a",
            "#ffcc66",
            "#ff6b6b",
            "#8fd3ff",
            "#c58cff",
            "#ffffff"
        ];


        particle.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        document.body.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 1500);

    }

}



/* ==========================================
   여러 번 폭죽
========================================== */

function startFireworks() {

    const positions = [

        [
            window.innerWidth * 0.18,
            window.innerHeight * 0.25
        ],

        [
            window.innerWidth * 0.82,
            window.innerHeight * 0.25
        ],

        [
            window.innerWidth * 0.50,
            window.innerHeight * 0.18
        ],

        [
            window.innerWidth * 0.28,
            window.innerHeight * 0.48
        ],

        [
            window.innerWidth * 0.72,
            window.innerHeight * 0.48
        ],

        [
            window.innerWidth * 0.50,
            window.innerHeight * 0.38
        ]

    ];


    /*
       첫 번째 폭죽부터
       순서대로 터짐
    */

    positions.forEach(
        (position, index) => {

            setTimeout(() => {

                createFirework(
                    position[0],
                    position[1]
                );

            }, index * 300);

        }
    );


    /*
       조금 뒤에 한 번 더!
    */

    setTimeout(() => {

        positions.forEach(
            (position, index) => {

                setTimeout(() => {

                    createFirework(
                        position[0],
                        position[1]
                    );

                }, index * 220);

            }
        );

    }, 2300);

}

</script>

</body>
</html>
