<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Khaiii 💗</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #f9e4e4;
    overflow: hidden;
    font-family: Georgia, serif;
}

#app {
    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 25px;
}


/* =========================
   첫 화면
========================= */

#introScreen {
    width: 100%;
    cursor: pointer;
    user-select: none;
}

.introTitle {
    margin: 0;

    color: #d72832;

    font-size: clamp(30px, 6vw, 58px);
    font-weight: bold;
}

.introSubtitle {
    margin-top: 25px;

    color: #806d69;

    font-family: monospace;
    font-size: clamp(17px, 3vw, 23px);
}

.tapHint {
    margin-top: 50px;

    color: #d72832;

    font-size: 30px;

    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: 0.4;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =========================
   고백 화면
========================= */

#firstScreen {
    display: none;

    width: 100%;
    max-width: 900px;
}

.firstPhoto {
    width: min(400px, 75vw);
    max-height: 48vh;

    object-fit: contain;

    margin-bottom: 35px;

    border-radius: 12px;
}

#question {
    margin: 0 0 32px;

    color: #d72832;

    font-family: monospace;

    font-size: clamp(23px, 4vw, 36px);

    font-weight: 500;

    transition: color 0.2s ease;
}

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 15px;

    min-height: 80px;
}

button {
    border: none;

    border-radius: 50px;

    padding: 16px 38px;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;

    touch-action: manipulation;
}

#yes {
    background: #f2b1c4;
    color: #96344f;
}

#no {
    background: #fffafa;
    color: #796967;

    z-index: 30;
}

#message {
    min-height: 35px;

    margin-top: 20px;

    color: #d72832;

    font-family: monospace;

    font-size: 19px;

    font-weight: bold;
}


/* =========================
   성공 화면
========================= */

#successScreen {
    display: none;

    width: 100%;
    max-width: 900px;

    position: relative;

    z-index: 5;
}

#successText {
    margin-bottom: 25px;

    color: #d72832;

    font-family: monospace;

    font-size: clamp(28px, 6vw, 55px);

    font-weight: bold;
}

#successPhoto {
    width: min(500px, 82vw);

    max-height: 60vh;

    object-fit: contain;

    border-radius: 15px;
}


/* =========================
   화면 전환
========================= */

.fade {
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================
   폭죽
========================= */

.firework {
    position: fixed;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 100;

    animation:
        fireworkMove 1.5s
        cubic-bezier(0.1, 0.7, 0.2, 1)
        forwards;
}

@keyframes fireworkMove {

    0% {
        transform:
            translate(0, 0)
            scale(1.5);

        opacity: 1;
    }

    65% {
        opacity: 1;
    }

    100% {
        transform:
            translate(var(--x), var(--y))
            scale(0.1);

        opacity: 0;
    }
}

</style>
</head>


<body>

<div id="app">

    <!-- =====================
         첫 번째 화면
    ====================== -->

    <section id="introScreen">

        <h1 class="introTitle">
            Hi Khaiii, I have something to tell you..
        </h1>

        <p class="introSubtitle">
            Tap the screen!
        </p>

        <div class="tapHint">
            ♡
        </div>

    </section>


    <!-- =====================
         고백 화면
    ====================== -->

    <section id="firstScreen">

        <img
            src="first.jpg"
            class="firstPhoto"
            alt="Flower"
        >

        <h1 id="question">
            Do you want to go out with me?
        </h1>

        <div class="buttons">

            <button id="yes">
                YES 💗
            </button>

            <button id="no">
                NO
            </button>

        </div>

        <div id="message"></div>

    </section>


    <!-- =====================
         성공 화면
    ====================== -->

    <section id="successScreen">

        <div id="successText">
            waaaaaaaa ty love uuu 💗
        </div>

        <img
            src="final.jpg"
            id="successPhoto"
            alt="Celebration"
        >

    </section>

</div>


<!-- =====================
     음악
====================== -->

<audio
    id="loveSong"
    preload="auto"
>
    <source
        src="love-song.mp3"
        type="audio/mpeg"
    >
</audio>


<audio
    id="fanfare"
    preload="auto"
>
    <source
        src="fanfare.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

const introScreen =
    document.getElementById("introScreen");

const firstScreen =
    document.getElementById("firstScreen");

const successScreen =
    document.getElementById("successScreen");

const yesButton =
    document.getElementById("yes");

const noButton =
    document.getElementById("no");

const question =
    document.getElementById("question");

const message =
    document.getElementById("message");

const loveSong =
    document.getElementById("loveSong");

const fanfare =
    document.getElementById("fanfare");


let started = false;

let noCount = 0;

let escapeCount = 0;


/* ==========================================
   첫 화면
========================================== */

function startExperience() {

    if (started) {
        return;
    }

    started = true;


    /*
       사용자가 직접 화면을 클릭했기 때문에
       여기에서 음악을 재생
    */

    loveSong.volume = 0.65;

    loveSong.currentTime = 0;


    const music =
        loveSong.play();


    /*
       음악 재생에 성공/실패하더라도
       화면은 정상적으로 넘어감
    */

    if (music !== undefined) {

        music.catch((error) => {

            console.log(
                "Love song could not start:",
                error
            );

        });

    }


    /* 화면 전환 */

    introScreen.style.display =
        "none";

    firstScreen.style.display =
        "block";

    firstScreen.classList.add(
        "fade"
    );

}


/*
   첫 화면 어디든 클릭/터치
*/

introScreen.addEventListener(
    "pointerdown",
    startExperience
);


/*
   혹시 브라우저가 첫 재생을 막은 경우,
   고백 화면을 처음 클릭하면 다시 시도
*/

document.addEventListener(
    "pointerdown",
    () => {

        if (
            started &&
            loveSong.paused
        ) {

            loveSong.play()
                .catch(() => {});

        }

    }
);



/* ==========================================
   PC - NO 도망가기
========================================== */

function moveNoButton() {

    escapeCount++;


    /*
       NO REJECT 상태에서는
       절대로 다시 움직이지 않음
    */

    if (escapeCount >= 7) {
        return;
    }


    const padding = 30;


    const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        padding;


    const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        padding;


    const x =
        Math.max(
            padding,
            Math.random() * maxX
        );


    const y =
        Math.max(
            padding,
            Math.random() * maxY
        );


    noButton.style.position =
        "fixed";

    noButton.style.left =
        x + "px";

    noButton.style.top =
        y + "px";


    /*
       PC에서 7번 도망가면
       NO REJECT 표시
    */

    if (escapeCount === 7) {

        question.textContent =
            "NO REJECT";

        question.style.color =
            "#d00000";


        /*
           중요:
           여기서는 NO를 바로 없애지 않음.

           NO REJECT가 계속 보이도록 유지.
        */

    }

}


/*
   PC에서 NO에 마우스를 갖다 대면 도망
*/

noButton.addEventListener(
    "mouseenter",
    () => {

        const isDesktop =
            window.matchMedia(
                "(hover: hover) and (pointer: fine)"
            ).matches;


        if (isDesktop) {

            moveNoButton();

        }

    }
);



/* ==========================================
   모바일 - NO
========================================== */

noButton.addEventListener(
    "click",
    () => {

        const isMobile =
            window.matchMedia(
                "(pointer: coarse)"
            ).matches;


        /*
           PC에서는 NO를 클릭하면 도망
        */

        if (!isMobile) {

            moveNoButton();

            return;

        }


        /*
           실제로 NO를 눌렀을 때만
           횟수가 올라감
        */

        noCount++;


        /* =========================
           1번째 NO
        ========================= */

        if (noCount === 1) {

            question.textContent =
                "Are u sure?";

            message.textContent =
                "(Think again!)";


            setTimeout(
                () => {

                    /*
                       다시 첫 문장
                    */

                    question.textContent =
                        "Do you want to go out with me?";

                    message.textContent =
                        "";

                },
                1300
            );

        }


        /* =========================
           2번째 NO
        ========================= */

        else if (noCount === 2) {

            question.textContent =
                "真的吗？";

            message.textContent =
                "(Think again!)";


            setTimeout(
                () => {

                    question.textContent =
                        "Do you want to go out with me?";

                    message.textContent =
                        "";

                },
                1300
            );

        }


        /* =========================
           3번째 NO
        ========================= */

        else if (noCount === 3) {

            /*
               NO를 세 번째 눌렀을 때만
               NO REJECT
            */

            question.textContent =
                "NO REJECT";

            question.style.color =
                "#d00000";

            message.textContent =
                "";


            /*
               여기서는 잠시 보여준 후
               다시 질문으로 돌아감
            */

            setTimeout(
                () => {

                    question.textContent =
                        "Do you want to go out with me?";

                    question.style.color =
                        "#d72832";


                    /*
                       ⭐ 이제서야 NO가 사라짐
                    */

                    noButton.style.display =
                        "none";

                },
                1600
            );

        }

    }
);



/* ==========================================
   YES
========================================== */

yesButton.addEventListener(
    "click",
    () => {

        /*
           첫 번째 음악 정지
        */

        loveSong.pause();

        loveSong.currentTime = 0;


        /*
           고백 화면 숨김
        */

        firstScreen.style.display =
            "none";


        /*
           성공 화면 표시
        */

        successScreen.style.display =
            "block";

        successScreen.classList.add(
            "fade"
        );


        /*
           축하 음악
        */

        fanfare.pause();

        fanfare.currentTime =
            0;

        fanfare.volume =
            0.9;


        const celebration =
            fanfare.play();


        if (
            celebration !== undefined
        ) {

            celebration.catch(
                (error) => {

                    console.log(
                        "Fanfare could not start:",
                        error
                    );

                }
            );

        }


        /*
           폭죽 시작
        */

        startFireworks();

    }
);



/* ==========================================
   폭죽 하나 만들기
========================================== */

function createFirework(
    centerX,
    centerY
) {

    const particleCount =
        45;


    const colors = [

        "#ff5c8a",
        "#ffcc66",
        "#ff6b6b",
        "#8fd3ff",
        "#c58cff",
        "#ffffff"

    ];


    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "firework";


        particle.style.left =
            centerX + "px";


        particle.style.top =
            centerY + "px";


        const angle =
            (
                Math.PI * 2 * i
            ) /
            particleCount;


        const distance =
            80 +
            Math.random() * 170;


        const x =
            Math.cos(angle) *
            distance;


        const y =
            Math.sin(angle) *
            distance;


        particle.style.setProperty(
            "--x",
            x + "px"
        );


        particle.style.setProperty(
            "--y",
            y + "px"
        );


        particle.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => {
                particle.remove();
            },
            1500
        );

    }

}



/* ==========================================
   폭죽 여러 번
========================================== */

function startFireworks() {

    const positions = [

        [
            window.innerWidth * 0.18,
            window.innerHeight * 0.25
        ],

        [
            window.innerWidth * 0.82,
            window.innerHeight * 0.25
        ],

        [
            window.innerWidth * 0.50,
            window.innerHeight * 0.18
        ],

        [
            window.innerWidth * 0.28,
            window.innerHeight * 0.48
        ],

        [
            window.innerWidth * 0.72,
            window.innerHeight * 0.48
        ],

        [
            window.innerWidth * 0.50,
            window.innerHeight * 0.38
        ]

    ];


    /*
       첫 번째 폭죽
    */

    positions.forEach(
        (position, index) => {

            setTimeout(
                () => {

                    createFirework(
                        position[0],
                        position[1]
                    );

                },
                index * 280
            );

        }
    );


    /*
       두 번째 폭죽 세트
    */

    setTimeout(
        () => {

            positions.forEach(
                (position, index) => {

                    setTimeout(
                        () => {

                            createFirework(
                                position[0],
                                position[1]
                            );

                        },
                        index * 180
                    );

                }
            );

        },
        2300
    );


    /*
       마지막 가운데 대형 폭죽
    */

    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.5,
                window.innerHeight * 0.25
            );

        },
        4200
    );

}

</script>

</body>
</html>
